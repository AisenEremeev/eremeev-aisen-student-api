name: eremeev-aisen-student-api
services:
  app:
    build: .
    image: eremeev-aisen-student-api:v1.0-eremeev-aisen
    container_name: eremeev-aisen-student-api-app
    ports:
      - "127.0.0.1:${APP_PORT:-8082}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-student_api}
      DB_USER: ${DB_USER:-student_api}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [student-net]
    restart: unless-stopped
  db:
    image: postgres:17
    container_name: eremeev-aisen-student-api-db
    environment:
      POSTGRES_DB: ${DB_NAME:-student_api}
      POSTGRES_USER: ${DB_USER:-student_api}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - student-data:/var/lib/postgresql/data
    networks: [student-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  student-data:
networks:
  student-net:
    driver: bridge
